name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-integration:
    name: Repair experiment container integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker pull node:24-alpine
      - name: Verify independent acceptance and container timeout cleanup
        run: node --import tsx --test test/repair.test.ts
        env:
          HARNESS_TEST_DOCKER: "1"

  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  container-smoke:
    name: Container smoke tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker compose build harness

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Check CLI help
        run: docker compose run --rm harness --help

      - name: Check resolved configuration
        run: docker compose run --rm harness config --format json

      - name: Run no-TTY mock smoke test
        run: docker compose run --rm harness repl --provider mock --goal "CI smoke test" < /dev/null

      - name: Build Python runtime target
        run: docker build --target runtime-python -t evolving-coding-harness:ci-python .

      - name: Check Python runtime help
        run: docker run --rm evolving-coding-harness:ci-python --help
