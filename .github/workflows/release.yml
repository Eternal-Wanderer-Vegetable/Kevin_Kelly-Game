name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Prepare release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          npm version "$version" \
            --allow-same-version \
            --no-git-tag-version \
            --ignore-scripts

          bundle_name="evolving-coding-harness-${RELEASE_TAG}"
          mkdir -p "release/${bundle_name}"
          cp -R \
            dist \
            docs \
            Dockerfile \
            docker-compose.yml \
            LICENSE \
            README.md \
            README.zh-CN.md \
            package.json \
            package-lock.json \
            "release/${bundle_name}/"
          (
            cd release
            tar -czf "${bundle_name}.tar.gz" "${bundle_name}"
          )

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ github.ref_name }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  container:
    name: Publish ${{ matrix.target }} image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image-suffix: ""
          - target: runtime-python
            image-suffix: "-python"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Align package metadata with release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" \
          --allow-same-version \
          --no-git-tag-version \
          --ignore-scripts

      - name: Resolve lower-case image name
        id: image
        shell: bash
        env:
          IMAGE_SUFFIX: ${{ matrix.image-suffix }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Evolving Coding Harness
            org.opencontainers.image.description=Auditable experimental coding-agent harness
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    name: Create GitHub Release
    needs:
      - verify
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive-${{ github.ref_name }}
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(release-assets/*.tar.gz)
          if [[ "${#assets[@]}" -ne 1 ]]; then
            echo "expected exactly one release archive, found ${#assets[@]}" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[0]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          elif [[ "$tag" == *-* ]]; then
            gh release create "$tag" "${assets[0]}" \
              --prerelease \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[0]}" \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
